# Публикация на GitHub Pages. Наружу уходит ТОЛЬКО папка site/:
# README, черновики и всё остальное в репозитории на сайт не попадают.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Страховка: если в site/ случайно попали фото или документы,
      # сборка падает до публикации. Разрешены только html, css, svg и .nojekyll.
      - name: Check that site/ contains only allowed files
        run: |
          bad=$(find site -type f ! -name '*.html' ! -name '*.css' ! -name '*.svg' ! -name '.nojekyll')
          if [ -n "$bad" ]; then
            echo "::error::Запрещённые файлы в site/:"; echo "$bad"; exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
